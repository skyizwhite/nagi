name: Test

on:
  push:
    branches: main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm test
      - run: sh scripts/build.sh
      - run: test -z "$(git status --porcelain dist)"
